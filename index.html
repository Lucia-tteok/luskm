<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="选择款式并生成个性收款海报。"><title>收款码</title><link rel="stylesheet" href="./styles.css?v=58"><link rel="stylesheet" href="./preview.css?v=58"><link rel="stylesheet" href="./real-preview.css?v=58"><link rel="stylesheet" href="./single-preview.css?v=58"><link rel="stylesheet" href="./cleanup-v18.css?v=58"><link rel="stylesheet" href="./gallery-v20.css?v=58"></head><body>
<section id="styleLibrary" class="style-library-view"><div class="library-head"><span class="brand-mark">收款码</span><span class="privacy-pill">选择款式开始制作</span></div><div class="style-gallery">
<button class="style-choice" data-style="ink" aria-label="水墨云笺"><i class="style-thumb"></i></button><button class="style-choice" data-style="profile" aria-label="侧栏资料页"><i class="style-thumb"></i></button><button class="style-choice" data-style="desktop" aria-label="透明玻璃桌面"><i class="style-thumb"></i></button><button class="style-choice" data-style="collection" aria-label="左图右码资料卡"><i class="style-thumb"></i></button><button class="style-choice" data-style="social" aria-label="社交动态主页"><i class="style-thumb"></i></button><button class="style-choice" data-style="dew" aria-label="水滴玻璃卡"><i class="style-thumb"></i></button><button class="style-choice" data-style="card" aria-label="深色名片页"><i class="style-thumb"></i></button><button class="style-choice" data-style="apple" aria-label="青苹果双栏"><i class="style-thumb"></i></button><button class="style-choice" data-style="feed" aria-label="清新个人主页"><i class="style-thumb"></i></button>
</div></section>
<main id="editorView" class="app-shell" hidden><section class="editor" aria-label="收款码编辑器"><div class="brand-row"><span class="brand-mark">收款码</span><span class="privacy-pill">仅在本机处理</span></div><div class="control-group"><h2>图片素材</h2><div class="upload-grid"><button id="backgroundTrigger" class="upload-card" type="button"><span class="upload-icon">景</span><span><b>背景图</b><small>上传或从背景库选择</small></span></button><input id="bgInput" type="file" accept="image/*" hidden><label class="upload-card"><span class="upload-icon">像</span><span><b>头像</b><small>自动裁成圆形</small></span><input id="avatarInput" type="file" accept="image/*"></label><label class="upload-card"><span class="upload-icon">微</span><span><b>微信收款码</b><small>上传后自动识别</small></span><input id="wechatInput" type="file" accept="image/*"></label><label class="upload-card"><span class="upload-icon">赏</span><span><b>赞赏码</b><small>三码时自动居中</small></span><input id="appreciateInput" type="file" accept="image/*"></label><label class="upload-card"><span class="upload-icon">支</span><span><b>支付宝收款码</b><small>上传后自动识别</small></span><input id="alipayInput" type="file" accept="image/*"></label></div></div><div class="control-group text-controls"><h2>文字内容</h2><label><span>昵称</span><input id="nameInput" type="text" value="昵称" maxlength="16"></label><label><span>文案</span><input id="quoteInput" type="text" value="感谢你的支持与喜欢" maxlength="30"></label></div><div class="actions"><button id="downloadBtn" class="primary" type="button">下载成品 PNG</button><button id="resetBtn" class="secondary" type="button">恢复默认</button></div><p class="privacy-note">上传几个有效二维码，就自动生成单码、双码或三码版。</p></section>
<section class="preview-panel" aria-label="实时预览"><button id="backToLibrary" type="button">← 返回款式库</button><div class="canvas-wrap"><canvas id="poster" width="1254" height="1254"></canvas></div></section></main>
<dialog id="backgroundDialog" class="background-dialog"><div class="dialog-head"><strong>选择背景</strong><button id="closeBackground" type="button">×</button></div><div class="background-grid"><button type="button" class="background-card" data-bg="stars"><img src="./assets/backgrounds/silver-stars.png" alt="银灰星夜"><span>银灰星夜</span></button><button type="button" class="background-card" data-bg="ribbon"><img src="./assets/backgrounds/ivory-ribbon.png" alt="白色丝带"><span>白色丝带</span></button><button type="button" class="background-card" data-bg="clover"><img src="./assets/backgrounds/sage-clover.png" alt="四叶草"><span>四叶草</span></button><button type="button" class="background-card" data-bg="profileDefault"><img src="./assets/backgrounds/profile-default.png" alt="绿荫窗景"><span>绿荫窗景</span></button><button type="button" class="background-card" data-bg="desktopDefault"><img src="./assets/backgrounds/desktop-default.png" alt="雪地猫咪"><span>雪地猫咪</span></button><button type="button" class="background-card" data-bg="collectionDefault"><img src="./assets/backgrounds/collection-default.png" alt="粉白卧室"><span>粉白卧室</span></button><button type="button" class="background-card" data-bg="socialDefault"><img src="./assets/backgrounds/social-palette.png" alt=""><span></span></button><button type="button" class="background-card" data-bg="dewDefault"><img src="./assets/backgrounds/white-azalea.png" alt=""><span></span></button><button type="button" class="background-card" data-bg="cardDefault"><img src="./assets/backgrounds/dark-book.png" alt=""><span></span></button><button type="button" class="background-card" data-bg="appleDefault"><img src="./assets/backgrounds/blue-wind-chime.png" alt=""><span></span></button><button type="button" class="background-card" data-bg="feedDefault"><img src="./assets/backgrounds/star-curtain.png" alt=""><span></span></button></div><button id="uploadOwnBackground" class="primary upload-own" type="button">上传自己的背景</button></dialog><script src="./qr-tools.js"></script><script src="./app.js?v=59"></script></body></html>
